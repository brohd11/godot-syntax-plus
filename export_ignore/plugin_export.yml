export_root: "res://addons/syntax_plus/export_ignore/exports"
exports:
  -
    export_name: "syntax-plus{{version=syntax_plus}}"
    export_folder: "addons/syntax_plus"
    source: "res://addons/syntax_plus/"
exported_require: ["brohd11/godot-gdscript-lsp@v0.1.0"]
options:
  use_tag_in_cfg: true
  include_min_version: true
  include_import: true
  include_uid: true
  overwrite: true
  parser_settings:
    parse_cs:
      namespace_rename: {}
    parse_gd:
      reduce_access_paths: true
      optimizer:
        enabled: true
        struct_mode: auto
        inline_mode: auto
        aggressive: true
        debug_tags: true
    parse_tscn: {}
plugin_folder: "SyntaxPlus{{version=syntax_plus}}"
post_script: ""
pre_script: ""
